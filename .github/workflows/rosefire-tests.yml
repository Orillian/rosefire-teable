name: Rosefire Tests

# Fork-local CI: runs the unit suites for the packages the rosefire patch
# series (P1-P9 + this pass) actually touches. Deliberately does NOT run the
# nestjs-backend e2e battery (needs a live Postgres/Redis + per-worker DB
# provisioning - see dev-workflow.md for how to run that scope locally) and
# does NOT build/push a Docker image (images are built locally by design).
on:
  push:
    branches:
      - rosefire

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests (core, sdk, app, backend)

    strategy:
      matrix:
        node-version: [22.22.3]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: 🧩 Generate Prisma Client
        working-directory: packages/db-main-prisma
        run: |
          pnpm -F @teable/db-main-prisma prisma-generate --schema ./prisma/postgres/schema.prisma

      - name: 🏗 Run build
        run: |
          pnpm -F "./packages/**" -F "!@teable/v2-*" run build

      - name: 🧪 Run unit tests
        run: |
          pnpm -r -F "@teable/app" -F "@teable/core" -F "@teable/sdk" -F "@teable/backend" --parallel test-unit
